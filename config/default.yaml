provider: ollama_local
mode: code
permission_mode: manual

providers:
  ollama_local:
    type: ollama
    base_url: "http://localhost:11434"
    model: "qwen2.5-coder:7b"

  ollama_lan:
    type: ollama
    base_url: "http://192.168.0.50:11434"
    model: "qwen2.5-coder:7b"

  openai_default:
    type: openai_compatible
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    model: "gpt-4o-mini"

modes:
  code:
    provider: ollama_local
    model: "qwen2.5-coder:7b"
    skills: []
    input_budget_tokens: 2048
    max_tool_steps: 6

  reason:
    provider: ollama_local
    model: "deepseek-r1:8b"
    skills: []
    input_budget_tokens: 3072
    max_tool_steps: 8

  fast:
    provider: ollama_local
    model: "qwen2.5-coder:7b"
    skills: []
    input_budget_tokens: 1024
    max_tool_steps: 3

  smart:
    provider: ollama_local
    model: "qwen2.5-coder:14b"
    skills: []
    input_budget_tokens: 3072
    max_tool_steps: 8

  project:
    provider: ollama_local
    model: "qwen2.5-coder:7b"
    skills: []
    input_budget_tokens: 2048
    max_tool_steps: 8
    output_budget_tokens: 1024

memory_path: ".zerocoding/memory.db"
skills_path: "skills"
theme: "purple"
auto_save: true
