
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerocoding"
version = "0.1.0"
description = "Minimal personal Claude-style coding assistant with skills and memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
zerocoding = "zerocoding.cli:main"
