provider: llama_cpp_local
mode: code

providers:
  llama_cpp_local:
    type: llama_cpp
    base_url: "http://127.0.0.1:8080/v1"
    model: "ornith-1.5-9b-q5-k-m"
    # thinking: "auto"   # auto = the model decides (today's behaviour) | "on" | "off" | "budget:512" (reasoning tokens).
    #                    # Quote it: YAML reads an unquoted off as false. llama_cpp supports all; ollama (native type)
    #                    # on/off only; openai_compatible ignores it. The first request to a reasoning model is the
    #                    # slow one: "off" can cut it by several times, at some cost in answer quality (unmeasured).
  # An Ollama server should use the native API, which honours the context size ZeroCoding asks for:
  #   ollama_local: {type: ollama, base_url: "http://127.0.0.1:11434", model: "qwen3.5:4b"}

modes:
  code:
    provider: llama_cpp_local
    model: "ornith-1.5-9b-q5-k-m"
    skills: []

  reason:
    provider: llama_cpp_local
    model: "ornith-1.5-9b-q5-k-m"
    skills: []

  fast:
    provider: llama_cpp_local
    model: "ornith-1.5-9b-q5-k-m"
    skills: []

  smart:
    provider: llama_cpp_local
    model: "ornith-1.5-9b-q5-k-m"
    skills: []

memory_path: ".zerocoding/memory.db"
skills_path: "skills"
theme: "purple"
auto_save: true
max_input_tokens: 4096   # fallback prompt budget when the context window is unknown
context_window: 0        # 0 = detect from the server (llama.cpp /props); set a number for other backends
max_output_tokens: 1024
max_tool_rounds: 40   # safety cap per task (stops runaway loops); effort does not change it
# Local per-turn numbers (tokens, latency, tool errors) in .zerocoding/metrics/turns.jsonl; never prompts or answers.
metrics_enabled: true
# Opt-in: send only the tool schemas and skills relevant to each request.
dynamic_context: false
# Command packs that /permission auto approves without asking (fs, read, git, tests). Decided by code, inside the workspace only.
auto_packs: [fs, read, git]
shell_block_fallback: true # Small models sometimes print a ```bash block instead of calling run_command; offer it for approval as a command.
fullscreen: true # Fixed window with a scrollable transcript. false returns to the classic scrollback UI.
mouse_support: true # Click the small pet for an animation. Costs plain text selection while the prompt is open (Shift+drag still selects in most terminals) and wheel scrolling there; set false to restore both.
streaming_enabled: true # On since M7: 75/75 in the benchmark with usage reported. Set false to buffer whole replies.
session_persistence: true # Set false or pass --no-session-save to keep the current run ephemeral.

# run_command: always needs approval; this policy decides what may even be offered for approval.
# deny/allow are executable names (a denied list is always merged with built-in defaults such as sudo, dd, mkfs).
command_policy:
  deny: []
  allow: []            # empty = any executable that is not denied
  env_passthrough: []  # extra environment variables passed to commands (default: PATH, HOME, LANG, ...)
  timeout: 60
  max_output_chars: 8000

effort_profiles:
  low:
    max_output_tokens: 512
    max_tool_rounds: 40
  medium:
    max_output_tokens: 1024
    max_tool_rounds: 40
  high:
    max_output_tokens: 2048
    max_tool_rounds: 40

# --- Extensions (all opt-in; see docs/ROADMAP-m6.md) ---------------------------------------------

# Hooks run YOUR commands around tool calls, under command_policy. Zero prompt cost. Example:
# hooks:
#   - name: lint-python
#     event: post_tool            # pre_tool | post_tool | turn_end
#     match: [edit_file, write_file]
#     path: "*.py"                # optional glob over the tool target
#     command: "python3 -m py_compile ."   # stdin gets a JSON payload; env has ZC_HOOK_EVENT/ZC_TOOL_NAME/ZC_TOOL_TARGET
#   - event: pre_tool
#     blocking: true              # a failing blocking hook refuses the call (it can never approve anything)
#     match: run_command
#     command: "./scripts/check-command.sh"
hooks: []

# MCP servers (stdio). Nothing is exposed unless allowlisted under `tools`; non-read-only tools ask approval.
# mcp:
#   max_tools: 4
#   max_schema_tokens: 400        # ~65 tokens per tool are added to EVERY request
#   servers:
#     files:
#       command: ["python3", "server.py"]
#       env: {EXAMPLE: "1"}       # only these (plus PATH, HOME, ...) reach the server
#       tools:
#         read_note: {read_only: true}
mcp:
  max_tools: 4
  max_schema_tokens: 400
  servers: {}

# Read-only "explore" helper with its own context (sequential: saves context, not time).
subagents:
  enabled: false

# Declarative plugins (skills + hooks + MCP config, no Python). Enabling one trusts its hooks and servers.
plugins:
  path: "~/.zerocoding/plugins"
  enabled: []

# Run the project's own checks after the agent edits files and show failures to the model (up to max_attempts re-runs
# per request, after the first run). `commands` is trusted like a hook; when empty, a command is detected (pytest/unittest, npm test,
# cargo test, go test) and shown for approval the first time. /verify controls it per session.
verify:
  enabled: true
  commands: []
  max_attempts: 2   # fix rounds after a failing run (so up to 3 runs per request)
  timeout: 120

# A short file of project conventions in the workspace root (first found: ZEROCODING.md, AGENTS.md, CLAUDE.md) is added to
# the system prompt, capped at max_chars. It cannot change approvals. No file means no prompt change. /instructions shows it.
instructions:
  enabled: true
  max_chars: 2000
